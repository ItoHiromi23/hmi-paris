name: Deploy Nuxt to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate static site
        run: npm run generate

      - name: Install SFTP tools
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y sshpass openssh-client

      - name: Check generated files
        working-directory: .
        run: |
          echo "Checking Nuxt output..."
          ls -la frontend/.output/public

      - name: Deploy to IONOS over SFTP
        working-directory: .
        timeout-minutes: 5
        env:
          SFTP_HOST: access-5021134109.webspace-host.com
          SFTP_USERNAME: su662229
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: "22"
        run: |
          set -euo pipefail

          if [ -z "${SFTP_PASSWORD}" ]; then
            echo "Missing GitHub secret SFTP_PASSWORD"
            exit 1
          fi

          echo "SFTP ${SFTP_USERNAME}@${SFTP_HOST}:${SFTP_PORT} -> /public"

          echo "Checking TCP reachability..."
          if timeout 12 bash -c "echo >/dev/tcp/${SFTP_HOST}/${SFTP_PORT}"; then
            echo "TCP connect succeeded"
          else
            echo "TCP connect failed — GitHub cannot reach this SFTP host/port"
            exit 1
          fi

          export SSHPASS="$SFTP_PASSWORD"
          sshpass -e sftp -v \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -P "$SFTP_PORT" \
            "$SFTP_USERNAME@$SFTP_HOST" <<'EOF'
          -mkdir public
          put -r frontend/.output/public/. /public/
          bye
          EOF

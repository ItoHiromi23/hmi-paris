name: Deploy Nuxt to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate static site
        run: npm run generate

      - name: Install SFTP tools
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Check generated files
        working-directory: .
        run: |
          echo "Checking Nuxt output..."
          ls -la frontend/.output/public

      - name: Deploy to IONOS over SFTP
        working-directory: .
        timeout-minutes: 5
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -euo pipefail

          trim() { printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          HOST="$(trim "${SFTP_HOST}")"
          USER="$(trim "${SFTP_USERNAME}")"
          PASS="$(trim "${SFTP_PASSWORD}")"
          PORT="$(trim "${SFTP_PORT}")"
          HOST="${HOST#sftp://}"

          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ] || [ -z "$PORT" ]; then
            echo "Missing GitHub Actions secrets. Add SFTP_HOST, SFTP_USERNAME, SFTP_PORT, and SFTP_PASSWORD."
            exit 1
          fi

          echo "SFTP ${USER}@${HOST}:${PORT} -> /public"

          echo "Checking TCP reachability..."
          if timeout 12 bash -c "echo >/dev/tcp/${HOST}/${PORT}"; then
            echo "TCP connect succeeded"
          else
            echo "TCP connect failed — GitHub cannot reach this SFTP host/port"
            exit 1
          fi

          ASKPASS="$(mktemp)"
          BATCH="$(mktemp)"
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$SFTP_ASKPASS_PASSWORD"' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          printf '%s\n' \
            '-mkdir public' \
            'put -r frontend/.output/public/. /public/' \
            'bye' > "$BATCH"

          export SFTP_ASKPASS_PASSWORD="$PASS"
          export SSH_ASKPASS="$ASKPASS"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY="${DISPLAY:-:0}"
          unset SSH_AUTH_SOCK

          setsid -w sftp -v \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -P "$PORT" \
            -b "$BATCH" \
            "$USER@$HOST"

name: Deploy Nuxt to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate static site
        run: npm run generate

      - name: Install SFTP tools
        working-directory: .
        run: python3 -m pip install paramiko

      - name: Check generated files
        working-directory: .
        run: |
          echo "Checking Nuxt output..."
          ls -la frontend/.output/public

      - name: Deploy to IONOS over SFTP
        working-directory: .
        timeout-minutes: 5
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          python3 << 'PY'
          import os
          from pathlib import Path
          import paramiko

          def trim(value: str) -> str:
              return (value or "").replace("\r", "").strip()

          host = trim(os.environ.get("SFTP_HOST", "")).removeprefix("sftp://")
          user = trim(os.environ.get("SFTP_USERNAME", ""))
          password = trim(os.environ.get("SFTP_PASSWORD", ""))
          port_raw = trim(os.environ.get("SFTP_PORT", "22"))

          if not all([host, user, password, port_raw]):
              raise SystemExit("Missing GitHub Actions secrets: SFTP_HOST, SFTP_USERNAME, SFTP_PORT, SFTP_PASSWORD")

          port = int(port_raw)
          local_root = Path("frontend/.output/public")
          remote_root = "/public"

          if not local_root.is_dir():
              raise SystemExit(f"Missing generated site at {local_root}")

          print(f"SFTP {user}@{host}:{port} -> {remote_root}")

          transport = paramiko.Transport((host, port))
          transport.connect(username=user, password=password)
          sftp = paramiko.SFTPClient.from_transport(transport)

          def ensure_dir(remote_path: str) -> None:
              parts = [part for part in remote_path.split("/") if part]
              current = ""
              for part in parts:
                  current += f"/{part}"
                  try:
                      sftp.stat(current)
                  except OSError:
                      sftp.mkdir(current)

          ensure_dir(remote_root)
          uploaded = 0
          for path in local_root.rglob("*"):
              rel = path.relative_to(local_root).as_posix()
              remote = f"{remote_root}/{rel}"
              if path.is_dir():
                  ensure_dir(remote)
                  continue
              ensure_dir(str(Path(remote).parent).replace("\\", "/"))
              sftp.put(str(path), remote)
              uploaded += 1

          sftp.close()
          transport.close()
          print(f"SFTP deploy complete ({uploaded} files)")
          PY

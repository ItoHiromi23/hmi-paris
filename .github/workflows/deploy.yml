name: Deploy Nuxt to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate static site
        run: npm run generate

      - name: Install SFTP tools
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y sshpass openssh-client

      - name: Check generated files
        working-directory: .
        run: |
          echo "Checking Nuxt output..."
          ls -la frontend/.output/public

      - name: Deploy to IONOS
        working-directory: .
        timeout-minutes: 5
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -euo pipefail
          PORT="${SFTP_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -4 -p "$PORT" -T 20 "$SFTP_HOST" >> ~/.ssh/known_hosts

          export SSHPASS="$SFTP_PASSWORD"

          sshpass -e sftp -v \
            -o AddressFamily=inet \
            -o StrictHostKeyChecking=yes \
            -P "$PORT" \
            "$SFTP_USERNAME@$SFTP_HOST" <<'EOF'
          -mkdir public
          put -r frontend/.output/public/. /public/
          bye
          EOF

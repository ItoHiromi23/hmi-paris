name: Deploy Nuxt to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate static site
        run: npm run generate

      - name: Install lftp
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Check generated files
        working-directory: .
        run: |
          echo "Checking Nuxt output..."
          ls -la frontend/.output/public

      - name: Deploy to IONOS
        working-directory: .
        timeout-minutes: 3
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          echo "Connecting to $SFTP_HOST:$SFTP_PORT..."

          lftp -c "
          set net:timeout 15;
          set net:max-retries 1;
          set net:reconnect-interval-base 5;
          set sftp:auto-confirm yes;

          open -u \"$SFTP_USERNAME\",\"$SFTP_PASSWORD\" sftp://$SFTP_HOST:$SFTP_PORT;

          echo Connected to IONOS;

          pwd;
          ls;

          mirror -R \
            --verbose \
            ./frontend/.output/public/ \
            /public/;

          bye;
          "
